# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

# GitHub-hosted ubuntu-latest runners are x86-64 Linux VMs with systemd, so the
# Nix installer sets up the usual multi-user daemon with the build sandbox on.
# Every action is pinned to a full commit SHA; the comment names its release.
#
# Every gate keeps running after earlier failures. ci-logs/<step>.log (uploaded
# as an artifact) and the final "Gate summary" step name the failed gates; any
# failed gate also fails the job, which is the check GitHub reports.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the repository. Fork pull requests run with the same
# read-only token and no secrets; nothing here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
      # Incremental session data only helps rebuilds on one machine; on a
      # runner it is gigabytes of target directory and cache archive.
      CARGO_INCREMENTAL: 0
    steps:
      # The pinned CPU dependency and its submodules are anonymously fetchable.
      # Do not leave the job token in .git/config next to unsandboxed builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Nix store (devShell with the Rust toolchain and QEMU, plus the
      # firmware builds), the test-profile target directory, the cache
      # archives and the fixtures lane's downloads (about 330 MB) together
      # outgrow the free space a hosted runner guarantees. Remove preinstalled
      # toolchains this job never uses.
      - name: Free disk space
        id: disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      # The action pins the Nix release it installs (2.35.6 for this commit).
      - name: Install Nix
        id: nix
        if: ${{ !cancelled() }}
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          enable_kvm: false

      # The action writes the job token into nix.conf for github.com downloads.
      # Nix does not need it: without a token it fetches locked GitHub inputs
      # from the public archive URLs, outside the API rate limit. Like the
      # checkout above, keep the token away from the unsandboxed builds.
      - name: Drop the job token from the Nix configuration
        id: nix_token
        if: ${{ !cancelled() && steps.nix.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo sed -i '/^access-tokens[[:space:]]*=/d' /etc/nix/nix.conf
          if grep -q 'access-tokens' /etc/nix/nix.conf; then
            echo '::error::/etc/nix/nix.conf still sets access-tokens'
            exit 1
          fi

      - name: Dev shell
        id: devshell
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh devshell

      # Reuse Cargo's registry/git downloads, and the compiled target directory
      # across source-only commits. The Nix and Cargo locks pin the caches'
      # toolchain and dependency graph; the explicit saves also run when a gate
      # is red. Downloads may come from an older lock file (Cargo fetches what
      # is missing). The target directory is only reused for the same locks:
      # a moved pin gives every crate above it a new artifact hash, and a
      # target restored from an older lock kept every earlier build next to
      # the new one, so the cache grew with each pin until the runner ran
      # short of disk.
      - name: Restore cargo downloads
        id: cargo_cache
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-x86_64-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-x86_64-

      - name: Restore cargo target
        id: target_cache
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-x86_64-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}

      # An explicit status function bypasses Actions' implicit success() check,
      # so one failed gate does not hide failures in the remaining gates.
      - name: Formatting
        id: fmt
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh fmt

      # The publication guard, then the crate-boundary check and its self-test.
      - name: Publication guard and crate boundaries
        id: guard
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh guard

      - name: Clippy
        id: clippy
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh clippy

      - name: Licences and dependency policy
        id: deny
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh deny

      # The gate selects the workspace test profile, including its hot-crate
      # optimizations, while keeping debug assertions and overflow checks.
      - name: Tests
        id: tests
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh tests

      # Missing fixtures make the boot goldens skip. Build them with the devShell's
      # nasm and filesystem tools first; a fetch/build failure must fail the job.
      - name: Build golden fixtures
        id: fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh fixtures

      # Reuse the same test profile and binaries as the ordinary workspace tests.
      # The user-supplied ROM lane is local only: CI never has that firmware.
      - name: Slow goldens
        id: goldens
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh goldens

      # A cancelled run is superseded by a newer one, which saves instead.
      - name: Save cargo downloads
        id: cache_save
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-x86_64-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}

      - name: Save cargo target
        id: target_cache_save
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' && steps.target_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-x86_64-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}

      # A re-run keeps the earlier attempt's logs, so each attempt gets its own name.
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-attempt-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: warn

      # Lists every step's outcome in the run summary and fails when any step
      # failed, so the red step names all failed gates at once.
      - name: Gate summary
        if: always()
        env:
          OUTCOMES: >-
            disk=${{ steps.disk.outcome }}
            nix=${{ steps.nix.outcome }}
            nix_token=${{ steps.nix_token.outcome }}
            devshell=${{ steps.devshell.outcome }}
            cargo_cache=${{ steps.cargo_cache.outcome }}
            target_cache=${{ steps.target_cache.outcome }}
            fmt=${{ steps.fmt.outcome }}
            guard=${{ steps.guard.outcome }}
            clippy=${{ steps.clippy.outcome }}
            deny=${{ steps.deny.outcome }}
            tests=${{ steps.tests.outcome }}
            fixtures=${{ steps.fixtures.outcome }}
            goldens=${{ steps.goldens.outcome }}
            cache_save=${{ steps.cache_save.outcome }}
            target_cache_save=${{ steps.target_cache_save.outcome }}
        run: |
          set -euo pipefail
          # The disk left at the end, next to what the target directory and
          # the Nix store took; a short runner shows up here first.
          df -h /
          du -sh target /nix/store 2>/dev/null || true
          failed=()
          {
            echo '| step | outcome |'
            echo '| --- | --- |'
            for pair in $OUTCOMES; do
              echo "| ${pair%%=*} | ${pair#*=} |"
              if [[ ${pair#*=} == failure ]]; then
                failed+=("${pair%%=*}")
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if (( ${#failed[@]} )); then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi
          echo 'all gate steps passed'
