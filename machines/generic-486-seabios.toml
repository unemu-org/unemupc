# SPDX-License-Identifier: AGPL-3.0-or-later
schema = 1
name = "generic-486-seabios"
description = "Intel486 DX ISA board with the unemu SeaBIOS fork and COM1"

[board]
model = "generic-486-isa"

[board.rtc]
start = "2000-01-01T00:00:00"
nvram = "derived"

[cpu]
model = "80486dx"
fpu = "integrated"
clock_mhz = 33

[memory]
conventional_kib = 640
extended_kib = 15360

[firmware.bios]
image = "../vendor/seabios/bios-1.17.0-isa.bin"
sha256 = "ad50fdb5e12a03dd5c17eac481a4183a7793b84252319eea02b8c878667c994f"

# SeaBIOS receives this video ROM through fw_cfg and copies it to C0000h.
[[firmware.option_roms]]
image = "../vendor/seabios/build/vgabios-1.17.0-stdvga.bin"
sha256 = "1adc6c0fa72b93c5d0659575c992b1bf6f64fd451c444b2a735e22f0a3d6e925"
base = 0xC0000

[[card]]
kind = "vga"

[[card]]
kind = "uart-16550"
port = 0x3F8
irq = 4
