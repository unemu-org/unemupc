# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/device",
    "crates/bus",
    "crates/chipset",
    "crates/cpu",
    "crates/machine",
    "crates/devices",
    "crates/video",
    "crates/audio",
    "crates/assembly",
    "crates/testkit",
    "crates/unemupc",
    "crates/view",
    "crates/pc-harness",
    "crates/pc-core",
    "crates/journal",
    "crates/journal-files",
    "crates/machine-file",
    "crates/pc-config",
]

[workspace.package]
version = "0.0.4"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/unemu-org/unemupc"
# Workspace crate names (cpu, bus, device, machine, ...) collide
# with unrelated crates on crates.io; nothing here is published there.
publish = false

[workspace.dependencies]
unemupc = { path = "crates/unemupc", version = "0.0.4" }
machine-view = { version = "0.0.4", git = "https://github.com/unemu-org/unemu-host", rev = "1692a1fcfd6c9900d3074786a54f51c9de3b30f0" }
unemu-test-core = { version = "0.0.4", git = "https://github.com/unemu-org/unemu-host", rev = "1692a1fcfd6c9900d3074786a54f51c9de3b30f0" }
winit = "0.30"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
# Library error enums (§conventions: thiserror for stable library errors).
thiserror = "1"
# Command-line and test error plumbing.
anyhow = "1"
# SHA-256 for media image identity.
sha2 = "0.10"
# CPU core: one device read and one device write for exchange and read-modify-write
# instructions on memory-mapped devices, and RAM/ROM lookups off the hot memory path.
# Every build and golden trace runs against a known CPU. A bare path dependency breaks
# nix build and CI. To develop against a local x86jit checkout, add a gitignored
# [patch] override instead of editing this line.
x86jit-core = { version = "0.3", git = "https://github.com/unemu-org/x86jit", rev = "89532547e3bca71f82d63dfb463e018d7b471ac0", default-features = false }
# The contract between front ends and emulator cores, at the commit of release
# v0.2.0. Every core and front end in one build must link the same copy, so the
# pin is an exact revision, moved together with every pinned core. A bare path
# dependency breaks nix build and CI. To develop against a local checkout of the
# contract, add a gitignored [patch] override instead of editing this line.
unemu-core-api = { version = "0.5", git = "https://github.com/unemu-org/unemu-core-api", rev = "316dd2a1f429cc3ef37a2bed203e89b2160079ff" }
# The contract's storage and content over host files, from the contract's
# repository at the same revision: it depends on that copy of the contract.
unemu-core-files = { version = "0.5", git = "https://github.com/unemu-org/unemu-core-api", rev = "316dd2a1f429cc3ef37a2bed203e89b2160079ff" }
# Internal crates share the workspace version.
assembly = { path = "crates/assembly", version = "0.0.4" }
device = { path = "crates/device", version = "0.0.4" }
bus = { path = "crates/bus", version = "0.0.4" }
chipset = { path = "crates/chipset", version = "0.0.4" }
cpu = { path = "crates/cpu", version = "0.0.4" }
machine = { path = "crates/machine", version = "0.0.4" }
machine-file = { path = "crates/machine-file", version = "0.0.4" }
pc-config = { path = "crates/pc-config", version = "0.0.4" }
journal = { path = "crates/journal", version = "0.0.4" }
journal-files = { path = "crates/journal-files", version = "0.0.4" }
devices = { path = "crates/devices", version = "0.0.4" }
video = { path = "crates/video", version = "0.0.4" }
audio = { path = "crates/audio", version = "0.0.4" }
testkit = { path = "crates/testkit", version = "0.0.4" }
unemu-pc-core = { path = "crates/pc-core", version = "0.0.4" }

# Keep hardware preconditions and arithmetic checked even in optimized dev/test code.
[profile.dev]
debug-assertions = true
overflow-checks = true

# The CPU core and its decoder dominate instruction execution in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

# Optimize the emulation loop while leaving host tools and test drivers unoptimized
# for debugging. The test profile inherits these optimization settings.
[profile.dev.package.devices]
opt-level = 3

[profile.dev.package.machine]
opt-level = 3

[profile.dev.package.bus]
opt-level = 3

[profile.dev.package.cpu]
opt-level = 3

[profile.dev.package.assembly]
opt-level = 3

[profile.dev.package.audio]
opt-level = 3

[profile.dev.package.chipset]
opt-level = 3
