# SPDX-License-Identifier: AGPL-3.0-or-later

[advisories]
# The emulation crates have no unmaintained dependency; the one accepted
# below reaches only the application-layer viewer.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "Accepted 2026-11-23: unemupc-view -> winit (and machine-view -> winit) -> sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser 0.25.1 provides Wayland client-side decorations, required for window frames on GNOME. This is an unmaintained crate, not a known vulnerability; no safe upgrade is available; the front end and unemu-host accept it the same way. Keep winit's default wayland-csd-adwaita feature. Review 2027-05-11." },
]

[licenses]
# Keep the allowlist limited to the all-features graph: workspace AGPL and
# permissive dependencies that can be distributed with it.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.9

# The PC core's text rasteriser embeds CC BY-SA 4.0 fonts.
[[licenses.exceptions]]
crate = "unemu-pc-core"
allow = ["CC-BY-SA-4.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The CPU core, the contract between front ends and cores,
# each pinned to an exact revision in the workspace manifest.
allow-git = [
    "https://github.com/unemu-org/x86jit",
    "https://github.com/unemu-org/unemu-core-api",
    "https://github.com/unemu-org/unemu-host",
]
