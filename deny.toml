# SPDX-License-Identifier: AGPL-3.0-or-later

[advisories]
ignore = []

[licenses]
# Keep the allowlist limited to the all-features graph: workspace AGPL and
# permissive dependencies that can be distributed with it.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
]
confidence-threshold = 0.9

# The PC core's text rasteriser embeds CC BY-SA 4.0 fonts.
[[licenses.exceptions]]
crate = "unemu-pc-core"
allow = ["CC-BY-SA-4.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The CPU core, the contract between front ends and cores,
# each pinned to an exact revision in the workspace manifest.
allow-git = [
    "https://github.com/unemu-org/x86jit",
    "https://github.com/unemu-org/unemu-core-api",
]
