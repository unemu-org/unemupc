[package]
name = "unemupc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The standalone PC core command line and shared machine commands."

[package.metadata.unemu]
layer = "pc"
side = "core"

[dependencies]
journal-files.workspace = true
pc-harness = { path = "../pc-harness", version = "0.0.4" }
machine-file.workspace = true
unemu-pc-core.workspace = true
unemu-core-api.workspace = true
assembly.workspace = true
machine.workspace = true
device.workspace = true
video.workspace = true
anyhow.workspace = true

[dev-dependencies]
pc-config.workspace = true
toml.workspace = true
unemu-core-api = { workspace = true, features = ["test-support"] }
machine-file = { workspace = true, features = ["test-support"] }
cpu.workspace = true
assembly = { workspace = true, features = ["test-support"] }
