# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "assembly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Declarative machine-configuration data model, validation, and the assembler that turns it into a running Machine (§3.1)."

[package.metadata.unemu]
layer = "emulation"

[dependencies]
thiserror.workspace = true
journal.workspace = true
sha2.workspace = true
# The contract's content and records: what the mount seam hands over
# (core-contract.md §12.5, step 10 of §12.10).
unemu-core-api.workspace = true
# The seams whose types the configuration names. The config is declarative data
# about these crates' hardware; the assembler (a later task) turns it into the
# concrete Bus/DecodeMap/IrqLine/Machine those crates define.
machine.workspace = true
cpu.workspace = true
bus.workspace = true
device.workspace = true
devices.workspace = true
video.workspace = true
audio.workspace = true
# The one shared 8259 interrupt controller: a live master/slave pair presented
# both as two bus device faces and as the machine's single controller seam.
chipset.workspace = true

[features]
host-profile = ["device/host-profile", "bus/host-profile", "machine/host-profile"]
default = []
test-support = ["journal/test-support"]
reference-scheduler = ["machine/reference-scheduler"]

[dev-dependencies]
testkit.workspace = true
journal = { workspace = true, features = ["test-support"] }
unemu-core-api = { workspace = true, features = ["test-support"] }
