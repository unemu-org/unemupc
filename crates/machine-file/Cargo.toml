[package]
name = "machine-file"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Machine description files (TOML and YAML) over one versioned schema."

[package.metadata.unemu]
layer = "pc"
side = "core"

[features]
host-profile = ["assembly/host-profile"]
test-support = ["dep:cpu", "assembly/test-support", "journal-files/test-support"]

[dependencies]
cpu = { workspace = true, optional = true }
devices.workspace = true
assembly.workspace = true
pc-config.workspace = true
journal-files.workspace = true
journal.workspace = true
unemu-core-api.workspace = true
sha2.workspace = true
serde.workspace = true
toml.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true

[dev-dependencies]
unemu-core-api = { workspace = true, features = ["test-support"] }
cpu.workspace = true
bus.workspace = true
device.workspace = true
devices.workspace = true
chipset.workspace = true
video.workspace = true
audio.workspace = true
testkit.workspace = true
journal-files = { workspace = true, features = ["test-support"] }
machine-file = { path = ".", features = ["test-support"] }
pc-config = { workspace = true, features = ["test-support"] }
assembly = { workspace = true, features = ["test-support"] }
machine.workspace = true
# The JIT backend a host program supplies, for the engine-equality tests.
x86jit-cranelift.workspace = true
